name: APK Android

# Compila el APK del juego cada vez que cambia y lo publica en Releases
on:
  push:
    branches: [main]
    paths: ["index.html", "android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copiar el juego dentro de la app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/index.html

      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JustDiceShow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JustDiceShow-apk
          path: JustDiceShow.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Just Dice Show (APK ${{ github.run_number }})
          body: |
            Descarga **JustDiceShow.apk** desde el móvil e instálalo
            (Android pedirá permiso para instalar apps de fuera de Google Play).
          files: JustDiceShow.apk
          make_latest: true
